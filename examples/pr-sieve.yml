# Copy to .github/workflows/pr-sieve.yml in the consuming repository.
# Pin the action to a commit SHA, not a floating tag.
name: pr-sieve
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
jobs:
  sieve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pin to a commit SHA (not a floating tag).
      - uses: Thestral12/pr-sieve@ea8e3559e7407534f4296cf5a83f79d8964784bd
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          config: .jev.yml
          fail-on: gate
          comment: sticky
